# Coolkidz mix-and-save: a Shopify discount function on the Coolkidz store's
# "Brand Dashboard" app. Only the extension is deployed; the app's own
# configuration (scopes, URLs) is left exactly as it is in the Dev Dashboard.
client_id = "ea4efb8ebc1601ef6ee695cf83aa32eb"
name = "Brand Dashboard"
application_url = "https://marketing.coolkidz.com.au"
embedded = false

[build]
include_config_on_deploy = false

[access_scopes]
use_legacy_install_flow = false

# Required by the CLI's validation. Not sent to Shopify: include_config_on_deploy
# is false above, so the app's real webhooks and auth settings are untouched.
[webhooks]
api_version = "2025-07"

[auth]
redirect_urls = ["https://marketing.coolkidz.com.au/api/auth/callback"]
