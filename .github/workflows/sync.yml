name: Sync dashboard data

# Runs the Shopify / tradeshow / calendar / AI-insights sync on GitHub's runners
# (Vercel has no Python). Twice daily + on demand from the dashboard's Sync Now
# button (workflow_dispatch via the GitHub API).
#
# Each sync below is its own job (calling sync-one.yml, which does the real
# checkout/setup/run), not a step in one big job — most of these scripts touch
# completely different services and never needed to wait on each other; they
# only used to run sequentially because they were written as steps. A handful
# have a real order dependency (below), everything else runs in parallel.
on:
  schedule:
    # Every 3 hours, around the clock (8×/day). UTC 00/03/06/09/12/15/18/21 =
    # AEST 10:00/13:00/16:00/19:00/22:00/01:00/04:00/07:00.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: dashboard-sync
  cancel-in-progress: false

jobs:
  # ── Independent syncs — run in parallel, no ordering between them ──
  asana:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_asana.py" }
    secrets: inherit
  connecteam:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_connecteam.py" }
    secrets: inherit
  main:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync.py" }
    secrets: inherit
  tradeshow_breakdown:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_tradeshow_breakdown.py" }
    secrets: inherit
  cin7_costs:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_cin7_costs.py" }
    secrets: inherit
  partnership_cin7_sales:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_partnership_cin7_sales.py" }
    secrets: inherit
  promo_calendar:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/load_promotions.py" }
    secrets: inherit
  shopify_sources:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_shopify_sources.py" }
    secrets: inherit
  meta_ads:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_meta.py" }
    secrets: inherit
  pinterest:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_pinterest.py" }
    secrets: inherit
  youtube:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_youtube.py" }
    secrets: inherit
  commission_factory:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_cf.py" }
    secrets: inherit
  instagram:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_instagram.py" }
    secrets: inherit
  instagram_media:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_instagram_media.py" }
    secrets: inherit
  ga4:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_ga4.py" }
    secrets: inherit
  eventbrite:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_eventbrite.py" }
    secrets: inherit
  klaviyo:
    # Used to run last on purpose, so its rate-limited metric-aggregates
    # calls couldn't starve the faster steps of the shared job timeout.
    # That reasoning only applied to sequential steps in one job — as its
    # own job it has its own timeout budget, so it's free to run alongside
    # everything else now.
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_klaviyo.py" }
    secrets: inherit
  search_console:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_gsc.py" }
    secrets: inherit
  blog_hub:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_blogs.py" }
    secrets: inherit
  shopify_extras:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_shopify_extras.py" }
    secrets: inherit
  cost_sheet:
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_cost_sheet.py" }
    secrets: inherit

  # ── Depends on fresh Shopify order data from `main` ──
  influencer_sales:
    needs: main
    if: ${{ always() }}
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/sync_influencer_sales.py" }
    secrets: inherit

  # ── Read the metrics the syncs above just wrote, so they need those to
  #    have actually run first (not necessarily succeeded — `always()` lets
  #    them go ahead even if one upstream job failed, same as before) ──
  metric_alerts:
    needs: [main, meta_ads, ga4, klaviyo]
    if: ${{ always() }}
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/metric_alerts.py" }
    secrets: inherit
  ai_insights:
    needs: [main, meta_ads, ga4, klaviyo, metric_alerts]
    if: ${{ always() }}
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/generate_insights.py" }
    secrets: inherit

  # ── Always runs last: emails an alert if any feed failed or went stale
  #    this run, so it needs every other job to have finished first ──
  sync_failure_alerts:
    needs: [asana, connecteam, main, tradeshow_breakdown, cin7_costs, partnership_cin7_sales,
            promo_calendar, shopify_sources, meta_ads, pinterest, youtube, commission_factory,
            instagram, instagram_media, ga4, eventbrite, klaviyo, search_console, blog_hub,
            shopify_extras, cost_sheet, influencer_sales, metric_alerts, ai_insights]
    if: ${{ always() }}
    uses: ./.github/workflows/sync-one.yml
    with: { script: "scripts/alert_sync.py" }
    secrets: inherit
