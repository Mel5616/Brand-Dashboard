name: Coolkidz merchandising

# Daily: star ratings from the brands' Klaviyo reviews, the Best sellers
# collection from the brands' online sales, and "New" tags on coolkidz.com.au.
on:
  schedule:
    - cron: "15 19 * * *"   # 5:15am AEST
  workflow_dispatch: {}

jobs:
  merch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write stores.config.json from secret
        env:
          STORES_CONFIG_JSON: ${{ secrets.STORES_CONFIG_JSON }}
        run: printf '%s' "$STORES_CONFIG_JSON" > stores.config.json
      - name: Ratings, best sellers and new tags
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/coolkidz_merch.py
