name: Review rewards

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch: {}

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write stores.config.json from secret
        env:
          STORES_CONFIG_JSON: ${{ secrets.STORES_CONFIG_JSON }}
        run: printf '%s' "$STORES_CONFIG_JSON" > stores.config.json
      - name: Mirror reviews and issue rewards for new ones
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/review_rewards.py
