name: Today digest (7am)

# Emails the Today queue — everything that needs a person across the
# dashboard — every morning. The dashboard builds and sends it; this just
# knocks on the door with the shared key.
on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 7:00 AEST (8:00 AEDT in summer)
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send the digest
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/today_ping.py digest
